name: Mobile CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v260608 or v1.2.3"
        required: true
        default: "v260608"
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test -- --runInBand
      - name: English UI guard
        working-directory: .
        run: node mobile/scripts/check-mobile-english-ui.mjs

  android-release:
    name: Build release APK
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Sync Android app version from release tag
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/, '');
          if (!/^\d+(?:\.\d+){0,2}$/.test(version)) {
            throw new Error('Release tag must use v<version>, for example v260608 or v1.2.3');
          }
          const appPath = 'app.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.expo.version = version;
          if (version.split('.').length === 1 && /^\d+$/.test(version)) {
            app.expo.android.versionCode = Number(version);
          }
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');
          console.log(`Android app version synchronized to ${version}`);
          NODE
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        working-directory: mobile
        run: cp android/app/build/outputs/apk/release/app-release.apk "monkeycode-${RELEASE_TAG}.apk"
      - name: Publish release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.RELEASE_TAG }}
          path: mobile/monkeycode-${{ env.RELEASE_TAG }}.apk
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: android-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ env.RELEASE_TAG }}
          path: release
      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          ## MonkeyCode Mobile ${RELEASE_TAG}

          Built automatically from ${RELEASE_TAG}.

          ### Android
          - `monkeycode-${RELEASE_TAG}.apk`: release APK
          EOF
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="release/monkeycode-${RELEASE_TAG}.apk"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${apk}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${apk}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "MonkeyCode Mobile ${RELEASE_TAG}"               --notes-file release-notes.md
          fi
